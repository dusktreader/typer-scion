[project]
name = "typer-scion"
version = "0.1.0"
description = "Enable typer subcommands to inherit common options from their parent commands."
authors = [
    {name = "Tucker Beck", email ="tucker.beck@gmail.com"},
]
readme = "README.md"
license-files = ["LICENSE.md"]

requires-python = ">=3.12, ~=3.15"
dependencies = []


[project.urls]
homepage = "https://github.com/dusktreader/typer-scion"
source = "https://github.com/dusktreader/typer-scion"
changelog = "https://github.com/dusktreader/typer-scion/blob/main/CHANGELOG.md"


[project.optional-dependencies]
demo = [ "roadshow>=0.1.2" ]



[project.scripts]
typer-scion-demo = "typer_scion_demo.main:main"


[dependency-groups]
dev = [
    "debugpy>=1.8",
    "ipython>=9.18",
    "mkdocstrings[python]>=0.29",
    "pyclean>=3.7",
    "pytest>=9.2",
    "pytest-bdd>=9.0",
    "pytest-cov>=7.1",
    "pytest-mock>=3.17",
    "pytest-pretty>=1.3",
    "pytest-random-order>=1.2",
    "ruff>=0.17.4",
    "ty>=0.0.100",
    "typos>=1.52",
    "zensical>=0.1.1 "
]


[tool.uv]
package = true


[tool.pytest.ini_options]
addopts = [
    "--random-order",
    "--cov=src/typer_scion",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    "--cov-report=xml:.coverage.xml",
    "--junitxml=.junit.xml",
    "--override-ini=junit_family=legacy",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_steps.py"]
markers = [
    "integration: Integration tests that exercise the real package with no mocking",
    "unit: Fast unit tests with all external dependencies mocked",
]


[tool.ruff]
line-length = 120
src = ["src/typer_scion", "tests", "src/typer_scion_demo", "examples"]


[tool.ruff.format]
docstring-code-format = true


[tool.typos.default]
extend-ignore-identifiers-re = []


[build-system]
requires = ["uv-build>=0.13.7,<0.14"]
build-backend = "uv_build"
